name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: Backend (testes, cobertura, ArchUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rota-segura-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify = testes (Testcontainers usa o Docker do runner) + checagem JaCoCo >= 80% em domain/application.
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco
          path: rota-segura-api/target/site/jacoco

  web:
    name: Frontend (testes, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rota-segura-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rota-segura-web/package-lock.json
      - run: npm ci
      - name: Análise estática (formatação)
        run: npx prettier --check "src/**/*.{ts,html}" "e2e/**/*.ts"
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: rota-segura-web/playwright-report

  imagens:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: rota-segura-api
          push: false
          tags: rota-segura-api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: rota-segura-web
          push: false
          tags: rota-segura-web:${{ github.sha }}
