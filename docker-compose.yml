# Sobe banco + API + web. Antes: cp .env.example .env e preencha (ROTA_JWT_SECRET, ROTA_API_BASE_URL...).
# Acesso: http://localhost:8081 (web). A API não é exposta fora da rede do compose.
name: rota-segura

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rota_segura
      MYSQL_USER: ${ROTA_DB_USUARIO:-rota_segura}
      MYSQL_PASSWORD: ${ROTA_DB_SENHA:?defina ROTA_DB_SENHA no .env}
      # Senha de root aleatória (aparece só no log da primeira subida); o painel usa o usuário acima.
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - dados-db:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 (TCP) só responde depois da inicialização completa; o socket responde antes.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  api:
    build: ./rota-segura-api
    env_file: .env
    environment:
      ROTA_DB_URL: jdbc:mysql://db:3306/rota_segura
      ROTA_FORWARD_HEADERS: native
      ROTA_CORS_ORIGENS: ${ROTA_CORS_ORIGENS:-http://localhost:8081}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  web:
    build: ./rota-segura-web
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  dados-db:
