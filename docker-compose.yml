# Sobe banco + API + web. Antes: cp .env.example .env e preencha (ROTA_JWT_SECRET, ROTA_API_BASE_URL...).
# Acesso: http://localhost:8081 (web). A API não é exposta fora da rede do compose.
name: rota-segura

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rota_segura
      POSTGRES_USER: ${ROTA_DB_USUARIO:-rota_segura}
      POSTGRES_PASSWORD: ${ROTA_DB_SENHA:?defina ROTA_DB_SENHA no .env}
    volumes:
      - dados-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./rota-segura-api
    env_file: .env
    environment:
      ROTA_DB_URL: jdbc:postgresql://db:5432/rota_segura
      ROTA_FORWARD_HEADERS: native
      ROTA_CORS_ORIGENS: ${ROTA_CORS_ORIGENS:-http://localhost:8081}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  web:
    build: ./rota-segura-web
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  dados-db:
