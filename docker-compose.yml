# Sobe banco + API + web. Local: cp .env.example .env e preencha. Portainer: cadastre as variáveis na stack.
# Acesso: http://localhost:8081 (web). A API não é exposta fora da rede do compose.
name: rota-segura

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rota_segura
      MYSQL_USER: ${ROTA_DB_USUARIO:-rota_segura}
      MYSQL_PASSWORD: ${ROTA_DB_SENHA:?defina ROTA_DB_SENHA no .env}
      # Senha de root aleatória (aparece só no log da primeira subida); o painel usa o usuário acima.
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - dados-db:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 (TCP) só responde depois da inicialização completa; o socket responde antes.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  api:
    build: ./rota-segura-api
    # Sem env_file: no Portainer (deploy por repositório) não existe .env nem stack.env. Cada variável vem da
    # substituição ${...} (variáveis da stack no Portainer, ou o .env local no docker compose).
    environment:
      ROTA_API_BASE_URL: ${ROTA_API_BASE_URL:?defina ROTA_API_BASE_URL}
      ROTA_API_AUTHORIZATION: ${ROTA_API_AUTHORIZATION:-}
      ROTA_API_MAX_PAGINAS: ${ROTA_API_MAX_PAGINAS:-200}
      ROTA_ZONA: ${ROTA_ZONA:-America/Sao_Paulo}
      ROTA_JANELA_SEM_CHEGADA: ${ROTA_JANELA_SEM_CHEGADA:-40m}
      ROTA_DB_URL: jdbc:mysql://db:3306/rota_segura
      ROTA_DB_USUARIO: ${ROTA_DB_USUARIO:-rota_segura}
      ROTA_DB_SENHA: ${ROTA_DB_SENHA:?defina ROTA_DB_SENHA}
      ROTA_JWT_SECRET: ${ROTA_JWT_SECRET:?defina ROTA_JWT_SECRET}
      ROTA_COOKIE_SECURE: ${ROTA_COOKIE_SECURE:-true}
      ROTA_CORS_ORIGENS: ${ROTA_CORS_ORIGENS:-http://localhost:8081}
      ROTA_ADMIN_LOGIN: ${ROTA_ADMIN_LOGIN:-}
      ROTA_ADMIN_SENHA: ${ROTA_ADMIN_SENHA:-}
      ROTA_SWAGGER_HABILITADO: ${ROTA_SWAGGER_HABILITADO:-false}
      ROTA_FORWARD_HEADERS: native
      ROTA_ALERTAS_HABILITADOS: ${ROTA_ALERTAS_HABILITADOS:-true}
      ROTA_INDICE_RESPONSAVEIS: ${ROTA_INDICE_RESPONSAVEIS:-true}
      ROTA_RASTREAMENTO_HABILITADO: ${ROTA_RASTREAMENTO_HABILITADO:-true}
      ROTA_RASTREAMENTO_INTERVALO: ${ROTA_RASTREAMENTO_INTERVALO:-5s}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_FROM: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  web:
    build: ./rota-segura-web
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  dados-db:
