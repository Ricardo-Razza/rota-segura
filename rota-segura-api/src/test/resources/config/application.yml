# Valores fictícios, usados só nos testes. O banco real vem do Testcontainers (@ServiceConnection).
spring:
  datasource:
    url: jdbc:mysql://localhost:1/nao-usado
    username: nao-usado
    password: nao-usado

rota-segura:
  api-externa:
    base-url: http://localhost:1
  alertas:
    # Nos testes o ciclo de 30 s só roda quando o teste chama executar().
    avaliacao-habilitada: false
  responsaveis:
    # Nos testes o índice é montado só quando o teste pede (sem tarefa agendada chamando a API).
    indice-habilitado: false
  auth:
    jwt-secret: segredo-ficticio-somente-para-testes-0123456789
    admin-login: admin.teste
    admin-senha: senha-ficticia-de-teste
