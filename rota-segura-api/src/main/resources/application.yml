server:
  # Atrás do nginx (docker-compose) use "native" para auditoria e rate limit verem o IP real.
  forward-headers-strategy: ${ROTA_FORWARD_HEADERS:none}

spring:
  application:
    name: rota-segura-api
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${ROTA_DB_URL}
    username: ${ROTA_DB_USUARIO}
    password: ${ROTA_DB_SENHA}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # MySQL não guarda fuso no datetime: tudo é gravado e lido em UTC; a conversão para o horário local
      # acontece só na exibição (rota-segura.jornada.zona).
      hibernate.jdbc.time_zone: UTC

rota-segura:
  api-externa:
    base-url: ${ROTA_API_BASE_URL}
    # Valor completo do cabeçalho Authorization; vazio = sem cabeçalho.
    authorization: ${ROTA_API_AUTHORIZATION:}
    connect-timeout: 2s
    read-timeout: 5s
    max-paginas: ${ROTA_API_MAX_PAGINAS:200}
    parametro-pagina: page
  cache:
    cadastros-ttl: 10m
    tempo-real-ttl: 30s
    ultimo-valor-ttl: 24h
    # Vencido o TTL, o valor ainda é servido na hora por até este tempo enquanto atualiza em segundo plano.
    janela-revalidacao: 30m
  jornada:
    zona: ${ROTA_ZONA:America/Sao_Paulo}
    # Embarcado há mais que isso sem passar no leitor da escola → EMBARCOU_SEM_CHEGADA (crítico).
    janela-sem-chegada: ${ROTA_JANELA_SEM_CHEGADA:40m}
    # Mesmo aluno no mesmo leitor dentro deste intervalo = leitura duplicada (ignorada e contada).
    intervalo-duplicidade: 2m
    # Sem nenhuma leitura até este horário → AUSENTE.
    limite-ausencia: "12:00"
    # Limite próprio por turno da matrícula (chave sem acento, em maiúsculas). Ex.: VESPERTINO: "17:00"
    limite-ausencia-por-turno: {}
    # Valores de tipo_de_uso_dispositivo_id (confirmados na API: 1 = VEICULAR, 2 = ESCOLAR).
    # Tipo fora destas listas não é classificado: o leitor é ignorado e reportado como pendência.
    tipos-leitor:
      embarque: ["1"]
      chegada: ["2"]
  calendario:
    # A API não expõe calendário escolar. Fim de semana já é excluído; liste aqui feriados e recessos.
    # Ex.: ["2026-04-21", "2026-06-04"]
    dias-sem-aula: []
  dispositivos:
    # Sem leitura há mais que isso, o leitor aparece como OFFLINE.
    limite-offline: 30m
  veiculos:
    # A API não informa capacidade. Lugares por id de veículo; sem valor, a ocupação fica "desconhecida".
    # Ex.: capacidade: { "7": 44, "8": 30 }
    capacidade: {}
    # Dias letivos anteriores usados para estimar "esperados" e tempo de trajeto de cada veículo.
    dias-historico: 10
    # Mesma regra para o card do veículo e para o alerta de lotação.
    limite-atencao: 90
    limite-critico: 100
  rastreamento:
    # GPS ao vivo: última posição de cada veículo com rastreador (GET /api/veiculos/{id}/dados).
    habilitado: ${ROTA_RASTREAMENTO_HABILITADO:true}
    intervalo: ${ROTA_RASTREAMENTO_INTERVALO:5s}
    # Cerca virtual: raio em volta da escola de destino (coordenada vinda dos leitores faciais).
    raio-escola-m: 300
    # Na cerca há mais que isso, com aluno a bordo sem passar no leitor da escola → alerta.
    tempo-desembarque: 10m
    # Posição do GPS mais antiga que isso aparece como "atrasada" (e não conta para a cerca).
    limite-posicao-atrasada: 2m
    # Novo ponto no rastro só depois de andar isso; teto de pontos guardados por veículo no dia.
    distancia-minima-m: 15
    max-pontos-rastro: 3000
  alertas:
    avaliacao-habilitada: ${ROTA_ALERTAS_HABILITADOS:true}
    intervalo: 30s
    # Janelas em que leitor sem leitura gera alerta (HH:mm-HH:mm).
    horarios-de-rota: ["05:30-08:30", "11:00-13:30", "17:00-19:00"]
  dashboard:
    # A API não informa a etapa. Mapeie etapa → anos escolares (texto de escola_turma_turma_descricao).
    # Ex.: etapas: { INFANTIL: ["Pré I", "Pré II"], FUNDAMENTAL: ["1º ano", "2º ano", "3º ano"] }
    etapas: {}
  tempo-real:
    heartbeat: 15s
  responsaveis:
    # Índice aluno → responsáveis: a API só traz o vínculo na busca de cada responsável por id,
    # então o índice é montado em segundo plano.
    indice-habilitado: ${ROTA_INDICE_RESPONSAVEIS:true}
    intervalo-indice: 10m
    # Teto de buscas por id em cada montagem (protege a API externa); acima disso o índice fica incompleto.
    max-buscas-indice: 2000
  auth:
    jwt-secret: ${ROTA_JWT_SECRET}
    access-ttl: 15m
    refresh-ttl: 7d
    cookie-secure: ${ROTA_COOKIE_SECURE:true}
    cors-origens: ${ROTA_CORS_ORIGENS:http://localhost:4200}
    login-max-tentativas: 5
    login-janela: 1m
    # Administrador inicial: criado na subida apenas se ainda não existir.
    admin-login: ${ROTA_ADMIN_LOGIN:}
    admin-senha: ${ROTA_ADMIN_SENHA:}

springdoc:
  api-docs:
    enabled: ${ROTA_SWAGGER_HABILITADO:false}
  swagger-ui:
    enabled: ${ROTA_SWAGGER_HABILITADO:false}

resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException

management:
  endpoints:
    web:
      exposure:
        # metrics exige perfil ADMIN (SecurityConfig).
        include: health,info,metrics
  endpoint:
    health:
      # Público: só o status. Detalhes (banco, API externa por recurso) só para ADMIN.
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true
      status:
        order: DOWN,OUT_OF_SERVICE,DEGRADADO,UNKNOWN,UP
        http-mapping:
          DEGRADADO: 200
  health:
    # A API externa fora do ar não deve derrubar o liveness (o painel segue servindo o último valor bom).
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
